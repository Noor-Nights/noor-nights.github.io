name: Dhul Hijjah Hourly Reminders

on:
  # Runs every hour between 03:00 and 22:00 Cairo (UTC+3).
  # UTC schedule: 00:00–19:00 UTC covers 03:00–22:00 Cairo, catching Fajr (~03:30–04:00).
  # General dhikr messages are still gated to 05:00–22:00 inside the script.
  # Active only during the 10 days of Dhul Hijjah 1447 (May 18–27, 2026).
  schedule:
    - cron: '0 0-19 * * *'   # Every hour, 00:00–19:00 UTC = 03:00–22:00 Cairo
  workflow_dispatch:          # Allow manual trigger for testing

jobs:
  send-push-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🕋 Fire Dhul Hijjah Hourly Push
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
        run: node automated_hourly_push.js
