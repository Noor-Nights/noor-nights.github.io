name: Noor Nights — Prayer & Dhikr Reminders

on:
  # Runs every minute, year-round (public repo = free unlimited minutes).
  # Prayer notifications: sent at the exact Cairo prayer minute (Fajr–Isha).
  # Dhul Hijjah dhikr messages: only during May 18–27, 2026, once per hour at :00.
  # UTC 00:00–20:59 covers Cairo 03:00–23:59 (UTC+3 in summer), catching all 5 prayers.
  schedule:
    - cron: '* 0-20 * * *'   # Every minute, 00:00–20:59 UTC = 03:00–23:59 Cairo (UTC+3 in summer)
  workflow_dispatch:          # Allow manual trigger for testing

permissions:
  actions: write   # needed to save the prayer-times cache

jobs:
  send-push-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install dependencies
        run: npm ci

      # Cache prayer times keyed on the Cairo calendar date.
      # On cache hit: skip the bake step — aladhan.com is not called at all.
      # On cache miss (first run of each new day): bake step runs once, then
      # the result is cached for every subsequent run that day.
      - name: 📅 Get Cairo date (cache key)
        id: cairo-date
        run: echo "date=$(TZ=Africa/Cairo date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: 🗓️ Restore Cairo prayer times cache
        id: prayer-cache
        uses: actions/cache@v4
        with:
          path: src/js/cairo-times.json
          key: cairo-times-${{ steps.cairo-date.outputs.date }}

      - name: 🕌 Bake today's prayer times (cache miss only)
        if: steps.prayer-cache.outputs.cache-hit != 'true'
        run: node scripts/bake-prayer-times.js > /dev/null

      - name: 🕋 Fire Prayer & Dhikr Push
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          MANUAL_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
        run: node automated_hourly_push.js
