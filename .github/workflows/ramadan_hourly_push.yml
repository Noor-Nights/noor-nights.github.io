name: Automated Ramadan Hourly Reminders

on:
  # Ramadan is over — schedule removed. Trigger manually only if needed.
  workflow_dispatch:

jobs:
  send-push-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🚀 Fire Hourly Push Script
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: node automated_hourly_push.js
