name: Noor Nights — Prayer & Dhikr Reminders

on:
  # Runs every hour, year-round.
  # Prayer notifications: sent daily whenever Cairo prayer hour matches (Fajr–Isha).
  # Dhul Hijjah dhikr messages: only during May 18–27, 2026 (gated inside the script).
  # UTC 00:00–20:00 covers Cairo 02:00–22:00 (UTC+2), catching all 5 prayers.
  schedule:
    - cron: '0 0-20 * * *'   # Every hour, 00:00–20:00 UTC = 02:00–22:00 Cairo
  workflow_dispatch:          # Allow manual trigger for testing

jobs:
  send-push-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🕋 Fire Dhul Hijjah Hourly Push
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
        run: node automated_hourly_push.js
