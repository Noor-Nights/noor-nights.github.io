name: Dhul Hijjah Hourly Reminders

on:
  # Runs every hour between 05:00 and 22:00 UTC+3 (Cairo).
  # UTC schedule: 02:00–19:00 UTC covers 05:00–22:00 Cairo (UTC+3).
  # Active only during the 10 days of Dhul Hijjah 1447 (May 18–27, 2026).
  # The script itself guards against running outside that window.
  schedule:
    - cron: '0 2-19 * * *'   # Every hour, 02:00–19:00 UTC = 05:00–22:00 Cairo
  workflow_dispatch:          # Allow manual trigger for testing

jobs:
  send-push-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🕋 Fire Dhul Hijjah Hourly Push
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: node automated_hourly_push.js
