name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets into app.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL secret is empty — aborting deployment"
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is empty — aborting deployment"
            exit 1
          fi
          sed -i "s|__SUPABASE_URL__|$SUPABASE_URL|g" src/js/app.js
          sed -i "s|__SUPABASE_ANON_KEY__|$SUPABASE_ANON_KEY|g" src/js/app.js
          if grep -q '__SUPABASE_URL__\|__SUPABASE_ANON_KEY__' src/js/app.js; then
            echo "::error::Placeholder strings still present in app.js after injection — check secret names match exactly"
            exit 1
          fi

      - name: Bake Cairo prayer times
        run: |
          node scripts/bake-prayer-times.js > src/js/cairo-times.js
          echo "Generated $(grep -c 'fajr' src/js/cairo-times.js) days of Cairo prayer times"

      - name: Stamp SW cache version with git SHA
        run: |
          SHA=$(git rev-parse --short HEAD)
          sed -i "s/noor-nights-v[0-9]*/noor-nights-${SHA}/" OneSignalSDKWorker.js
          echo "SW cache stamped: noor-nights-${SHA}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
