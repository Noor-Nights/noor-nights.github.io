name: Noor Nights — Daily Verse

on:
  schedule:
    - cron: '0 15 * * *'   # 18:00 Cairo (UTC+3 summer / UTC+2 winter ≈ 15:00–16:00 UTC)
  workflow_dispatch:         # Manual trigger for testing

permissions:
  actions: write   # needed to trigger deploy.yml via gh workflow run

jobs:
  update-daily-verse:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📖 Fetch verse + send push
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          MANUAL_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
        run: node scripts/fetch-daily-verse.js

      - name: 🚀 Trigger Pages deploy
        run: gh workflow run deploy.yml --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
