name: Noor Nights — Daily Verse

on:
  schedule:
    - cron: '0 15 * * *'   # 18:00 Cairo (UTC+3 summer / UTC+2 winter ≈ 15:00–16:00 UTC)
  workflow_dispatch:         # Manual trigger for testing

permissions:
  contents: write

jobs:
  update-daily-verse:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📖 Fetch daily verse
        run: node scripts/fetch-daily-verse.js

      - name: 💾 Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/js/daily-verse.json
          git diff --staged --quiet && echo "No verse change — skipping commit" && exit 0
          git commit -m "chore: daily verse $(date -u +%Y-%m-%d)"
          git push
