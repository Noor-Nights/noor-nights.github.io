name: Noor Nights — Daily Verse

on:
  schedule:
    - cron: '0 15 * * *'   # 18:00 Cairo (UTC+3 summer / UTC+2 winter ≈ 15:00–16:00 UTC)
  workflow_dispatch:         # Manual trigger for testing

permissions:
  contents: write

jobs:
  update-daily-verse:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📖 Fetch daily verse + send push
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          MANUAL_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
        run: node scripts/fetch-daily-verse.js

      - name: 💾 Commit and push
        env:
          MANUAL_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/js/daily-verse.json
          # On manual dispatch always commit so the deploy fires and the card updates
          if [ -n "$MANUAL_DISPATCH" ]; then
            git diff --staged --quiet && git commit --allow-empty -m "chore: manual verse refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)" || git commit -m "chore: manual verse refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          else
            git diff --staged --quiet && echo "No verse change — skipping commit" && exit 0
            git commit -m "chore: daily verse $(date -u +%Y-%m-%d)"
          fi
          git push
