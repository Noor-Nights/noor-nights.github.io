<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <!-- background -->
  <rect width="1024" height="500" fill="#111827"/>
  <!-- subtle gradient overlay -->
  <rect width="1024" height="500" fill="url(#feat-grad)"/>
  <defs>
    <linearGradient id="feat-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c2235" stop-opacity="1"/>
      <stop offset="50%" stop-color="#111827" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1c2235" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- star field -->
  <circle cx="80"  cy="60"  r="1.5" fill="white" opacity="0.4"/>
  <circle cx="180" cy="40"  r="1"   fill="white" opacity="0.35"/>
  <circle cx="320" cy="80"  r="1.5" fill="#dbbf6e" opacity="0.5"/>
  <circle cx="450" cy="30"  r="1"   fill="white" opacity="0.3"/>
  <circle cx="600" cy="55"  r="1.5" fill="white" opacity="0.4"/>
  <circle cx="720" cy="35"  r="1"   fill="#dbbf6e" opacity="0.4"/>
  <circle cx="850" cy="70"  r="1.5" fill="white" opacity="0.35"/>
  <circle cx="950" cy="45"  r="1"   fill="white" opacity="0.3"/>
  <circle cx="100" cy="420" r="1"   fill="white" opacity="0.25"/>
  <circle cx="280" cy="450" r="1.5" fill="#dbbf6e" opacity="0.35"/>
  <circle cx="500" cy="440" r="1"   fill="white" opacity="0.3"/>
  <circle cx="750" cy="430" r="1.5" fill="white" opacity="0.35"/>
  <circle cx="920" cy="460" r="1"   fill="#dbbf6e" opacity="0.3"/>
  <circle cx="55"  cy="250" r="1"   fill="white" opacity="0.2"/>
  <circle cx="970" cy="250" r="1.2" fill="white" opacity="0.25"/>

  <!-- icon card — left side -->
  <rect x="112" y="110" width="280" height="280" rx="56" fill="#111827" stroke="rgba(196,164,74,0.3)" stroke-width="1"/>
  <!-- icon artwork scaled to fit card — translate to card centre, scale up -->
  <g transform="translate(112,110) scale(2.8)">
    <circle cx="50" cy="52" r="36" fill="rgba(196,164,74,.07)"/>
    <path d="M62 25 C44 25 30 38 30 55 C30 72 44 85 62 85 C52 85 40 77 40 55 C40 33 52 25 62 25 Z" fill="#c5a352" opacity=".15"/>
    <path d="M63 22 C44 22 28 37 28 56 C28 75 44 90 63 90 C53 90 40 82 40 56 C40 30 53 22 63 22 Z" fill="none" stroke="#dbbf6e" stroke-width="2" stroke-linejoin="round"/>
    <path d="M63 22 C53 22 44 26 38 33" fill="none" stroke="#eecf8a" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>
    <circle cx="70" cy="56" r="30" fill="#111827"/>
    <g transform="translate(50,56)">
      <polygon points="0,-9 2.1,-2.9 8.6,-2.9 3.5,1.1 5.3,7.3 0,3.6 -5.3,7.3 -3.5,1.1 -8.6,-2.9 -2.1,-2.9" fill="#c5a352"/>
      <polygon points="0,-6.5 1.5,-2.1 6.2,-2.1 2.5,0.8 3.8,5.3 0,2.6 -3.8,5.3 -2.5,0.8 -6.2,-2.1 -1.5,-2.1" fill="#eecf8a"/>
    </g>
    <circle cx="24" cy="34" r="1.2" fill="#dbbf6e" opacity=".6"/>
    <circle cx="78" cy="28" r="1"   fill="#dbbf6e" opacity=".5"/>
    <circle cx="82" cy="72" r="0.8" fill="#eecf8a" opacity=".4"/>
    <circle cx="18" cy="68" r="1"   fill="#dbbf6e" opacity=".35"/>
    <circle cx="36" cy="22" r="0.8" fill="#eecf8a" opacity=".5"/>
  </g>

  <!-- right side text -->
  <!-- app name EN -->
  <text x="480" y="210" font-family="Georgia,serif" font-size="72" font-weight="400"
        letter-spacing="8" fill="#f2ede6">NOOR</text>
  <text x="480" y="292" font-family="Georgia,serif" font-size="72" font-weight="400"
        letter-spacing="8" fill="#f2ede6">NIGHTS</text>
  <!-- gold divider line -->
  <rect x="480" y="308" width="60" height="1.5" fill="rgba(196,164,74,0.55)" rx="1"/>
  <!-- Arabic -->
  <text x="860" y="352" font-family="Georgia,serif" font-size="36"
        fill="#dbbf6e" opacity="0.85" text-anchor="end">ليالي النور</text>
  <!-- tagline -->
  <text x="480" y="385" font-family="Georgia,serif" font-size="20"
        letter-spacing="4" fill="rgba(242,237,230,0.38)">TEN BLESSED DAYS · DHUL HIJJAH</text>
  <!-- memorial -->
  <text x="480" y="440" font-family="Georgia,serif" font-size="15"
        fill="rgba(242,237,230,0.22)" letter-spacing="1">Sadaqah Jariyah for Youssef Abdelkader — رحمه الله</text>
</svg>