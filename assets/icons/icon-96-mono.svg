<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 100 100">
  <!-- crescent white fill -->
  <path d="M62 25 C44 25 30 38 30 55 C30 72 44 85 62 85 C52 85 40 77 40 55 C40 33 52 25 62 25 Z"
        fill="white"/>
  <!-- crescent outer stroke white -->
  <path d="M63 22 C44 22 28 37 28 56 C28 75 44 90 63 90 C53 90 40 82 40 56 C40 30 53 22 63 22 Z"
        fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- inner cutout — transparent so it works on any bg -->
  <circle cx="70" cy="56" r="30" fill="black"/>
  <!-- star white -->
  <g transform="translate(50,56)">
    <polygon points="0,-9 2.1,-2.9 8.6,-2.9 3.5,1.1 5.3,7.3 0,3.6 -5.3,7.3 -3.5,1.1 -8.6,-2.9 -2.1,-2.9"
             fill="white"/>
  </g>
  <!-- sparkle dots white -->
  <circle cx="24" cy="34" r="1.2" fill="white" opacity=".7"/>
  <circle cx="78" cy="28" r="1"   fill="white" opacity=".6"/>
  <circle cx="18" cy="68" r="1"   fill="white" opacity=".5"/>
</svg>